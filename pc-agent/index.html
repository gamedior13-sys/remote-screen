<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remote Screen PC</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0b0f17; color: #e7ecf3; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 22px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b97a8; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 12.5px; color: #9aa6b6; margin: 14px 0 6px; letter-spacing: .02em; }
  input { width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid #243043; background: #121826; color: #e7ecf3; font-size: 15px; outline: none; }
  input:focus { border-color: #3b82f6; }
  button { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; font-size: 15.5px; font-weight: 700; cursor: pointer; }
  .primary { background: #2563eb; color: #fff; }
  .primary:disabled { background: #233049; color: #6b7686; cursor: default; }
  .stop { background: #3a1d22; color: #ff9aa2; }
  .card { background: #121826; border: 1px solid #1f2a3a; border-radius: 14px; padding: 16px; margin-top: 18px; }
  .idbox { text-align: center; padding: 10px 0 4px; }
  .idlabel { font-size: 12px; color: #8b97a8; }
  .idval { font-size: 34px; font-weight: 800; letter-spacing: 3px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .status { margin-top: 14px; font-size: 13.5px; color: #9aa6b6; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: 0 0 auto; }
  .dot.ok { background: #22c55e; } .dot.warn { background: #eab308; } .dot.err { background: #ef4444; }
  .hint { font-size: 12px; color: #6b7686; margin-top: 10px; line-height: 1.5; }
  .ver { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: #4b5668; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Remote Screen — Máy tính</h1>
  <div class="sub">Chia sẻ màn hình PC này để điều khiển từ điện thoại.</div>

  <div id="form">
    <label>Địa chỉ máy chủ</label>
    <input id="server" spellcheck="false" autocomplete="off" />
    <label>Mật khẩu (ít nhất 6 ký tự)</label>
    <input id="pw" type="password" autocomplete="off" placeholder="Đặt mật khẩu để điện thoại kết nối" />
    <button id="startBtn" class="primary">Bắt đầu chia sẻ</button>
    <div class="hint">Trên điện thoại mở trang web, nhập <b>ID</b> hiện ở đây và mật khẩu này để xem & điều khiển máy tính.</div>
  </div>

  <div id="live" class="card" style="display:none">
    <div class="idbox">
      <div class="idlabel">ID máy tính</div>
      <div class="idval" id="idval">—</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statustxt">Đang kết nối…</span></div>
    <button id="stopBtn" class="stop">Dừng chia sẻ</button>
    <div class="hint">Giữ cửa sổ này mở (có thể thu nhỏ). Đóng cửa sổ là dừng chia sẻ.</div>
  </div>
</div>
<div class="ver" id="ver"></div>

<script>
const APP_VER = '1.0.0';
const DEFAULT_SERVER = 'https://remote-screen-phong.onrender.com';
document.getElementById('ver').textContent = 'v' + APP_VER;

const $ = (id) => document.getElementById(id);
let ws = null, pc = null, dc = null, stream = null;
let current = null, registeredId = null, running = false, wsGen = 0;

function status(text, kind) {
  $('statustxt').textContent = text;
  const d = $('dot'); d.className = 'dot' + (kind ? ' ' + kind : '');
}
function wsUrl(server) { return server.replace(/^http/i, 'ws').replace(/\/+$/, '') + '/ws'; }
function wsSend(o) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); } catch (_) {} }
function dcSend(o) { try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); } catch (_) {} }

async function init() {
  let cfg = {};
  try { cfg = (await window.api.getCfg()) || {}; } catch (_) {}
  $('server').value = cfg.server || DEFAULT_SERVER;
  $('pw').value = cfg.password || '';
  if (cfg.id) registeredId = cfg.id;
}
init();

$('startBtn').addEventListener('click', start);
$('stopBtn').addEventListener('click', stop);

async function start() {
  const server = ($('server').value || DEFAULT_SERVER).trim();
  const password = ($('pw').value || '').trim();
  if (password.length < 6) { alert('Mật khẩu phải từ 6 ký tự trở lên.'); return; }
  current = { server, password };
  $('startBtn').disabled = true;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: false });
  } catch (e) {
    $('startBtn').disabled = false;
    alert('Không lấy được màn hình: ' + (e && e.message ? e.message : e));
    return;
  }
  try { await window.api.setCfg({ server, password, id: registeredId || '' }); } catch (_) {}
  running = true;
  $('form').style.display = 'none';
  $('live').style.display = 'block';
  openWs();
}

function stop() {
  running = false;
  closePeer();
  try { ws && (ws.onclose = null, ws.close()); } catch (_) {}
  ws = null;
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  $('live').style.display = 'none';
  $('form').style.display = 'block';
  $('startBtn').disabled = false;
}

function openWs() {
  const gen = ++wsGen;
  ws = new WebSocket(wsUrl(current.server));
  ws.onopen = () => {
    if (gen !== wsGen) return;
    const reg = { type: 'register', password: current.password, platform: 'windows' };
    if (registeredId) reg.id = registeredId;
    wsSend(reg);
    status('Đang đăng ký với máy chủ…', 'warn');
  };
  ws.onmessage = (e) => { if (gen === wsGen) { try { onSig(JSON.parse(e.data)); } catch (_) {} } };
  ws.onclose = () => {
    if (gen !== wsGen || !running) return;
    status('Mất kết nối máy chủ, đang thử lại…', 'err');
    setTimeout(() => { if (running && gen === wsGen) openWs(); }, 3000);
  };
  ws.onerror = () => {};
}

function onSig(m) {
  if (m.type === 'registered') {
    registeredId = m.id;
    $('idval').textContent = String(m.id).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
    window.api.setCfg({ server: current.server, password: current.password, id: m.id });
    status('Sẵn sàng — chờ điện thoại kết nối…', 'ok');
    return;
  }
  if (m.type === 'error') {
    status('Lỗi: ' + (m.message || m.code), 'err');
    return;
  }
  if (m.type === 'peer-joined') { startPeer(m.ice); return; }
  if (m.type === 'peer-left') { closePeer(); status('Điện thoại đã ngắt — chờ kết nối lại…', 'warn'); return; }
  if (m.type === 'signal' && pc) {
    const d = m.data || {};
    if (d.sdp) pc.setRemoteDescription(d.sdp).catch((e) => console.warn('sRD', e));
    else if (d.candidate) pc.addIceCandidate(d.candidate).catch(() => {});
  }
}

async function startPeer(ice) {
  closePeer();
  status('Điện thoại đang kết nối…', 'warn');
  let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
  if (ice) iceServers.push(ice);
  else {
    try {
      const cfg = await (await fetch(current.server.replace(/\/+$/, '') + '/config', { cache: 'no-store' })).json();
      if (cfg && cfg.iceServers) iceServers = cfg.iceServers;
    } catch (_) {}
  }
  const me = pc = new RTCPeerConnection({ iceServers });
  dc = pc.createDataChannel('ctrl');
  dc.onopen = () => sendHello();
  dc.onmessage = (ev) => { try { onCtrl(JSON.parse(ev.data)); } catch (_) {} };

  stream.getTracks().forEach((t) => pc.addTrack(t, stream));

  pc.onicecandidate = (e) => { if (e.candidate) wsSend({ type: 'signal', data: { candidate: e.candidate } }); };
  pc.onconnectionstatechange = () => {
    if (pc !== me) return;
    const s = pc.connectionState;
    if (s === 'connected') status('Đang chia sẻ màn hình ✓', 'ok');
    else if (s === 'disconnected') status('Mạng chập chờn…', 'warn');
    else if (s === 'failed') status('Kết nối thất bại, chờ thử lại…', 'err');
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    wsSend({ type: 'signal', data: { sdp: pc.localDescription } });
  } catch (e) { console.warn('offer', e); }
}

function closePeer() {
  try { dc && dc.close(); } catch (_) {}
  try { pc && pc.close(); } catch (_) {}
  pc = null; dc = null;
}

function sendHello() {
  dcSend({ t: 'hello', platform: 'windows', caps: ['mouse', 'keyboard', 'clipboard', 'file'], vname: 'PC ' + APP_VER, a11y: true });
}

// Giai đoạn 1: nhận lệnh điều khiển nhưng chưa thực thi — vẫn ACK để phía web biết kênh thông.
// Áp dụng mức chất lượng (độ phân giải/fps/bitrate) do web yêu cầu.
function onCtrl(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'ack') return;
  if (m.seq) dcSend({ t: 'ack', seq: m.seq });
  if (m.t === 'quality') applyQuality(m);
  // mouse/keyboard/clipboard/file: thêm ở giai đoạn sau.
}

async function applyQuality(q) {
  if (!pc || !stream) return;
  try {
    const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
    if (sender) {
      const p = sender.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      if (q.br) p.encodings[0].maxBitrate = q.br;
      if (q.fps) p.encodings[0].maxFramerate = q.fps;
      await sender.setParameters(p);
    }
  } catch (_) {}
  try {
    const vt = stream.getVideoTracks()[0];
    if (vt && q.fps) await vt.applyConstraints({ frameRate: q.fps });
  } catch (_) {}
}
</script>
</body>
</html>
