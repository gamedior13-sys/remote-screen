name: Build Android APK

on:
  push:
    paths-ignore:
      - "server/public/remote-screen.apk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One fixed signing key, kept in the repo, so new APKs install over old ones.
      - name: Stable signing key
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteScreen-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Publish the APK on the web server so phones can download it directly:
      # https://<server>/remote-screen.apk
      - name: Publish APK to server/public
        run: |
          # Always publish on top of the newest main (another run may have pushed meanwhile).
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/app.apk
          cp android/app/debug.keystore /tmp/debug.keystore
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/app.apk server/public/remote-screen.apk
            [ -f android/app/debug.keystore ] || cp /tmp/debug.keystore android/app/debug.keystore
            git add server/public/remote-screen.apk android/app/debug.keystore
            git commit -m "Publish APK" || exit 0
            git push && exit 0
            sleep 5
          done
          exit 1
