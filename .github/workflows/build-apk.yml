name: Build Android APK

on:
  push:
    paths-ignore:
      - "server/public/remote-screen.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteScreen-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Publish the APK on the web server so phones can download it directly:
      # https://<server>/remote-screen.apk
      - name: Publish APK to server/public
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk server/public/remote-screen.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add server/public/remote-screen.apk
          git commit -m "Publish APK" || exit 0
          git push
